<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Header - Web Portal</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style type="text/css">
        body.header-body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: #0f172a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
        }

        .banner-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 16px;
            height: 82px;
            background-color: #ffffff;
        }

        .banner-link {
            display: inline-block;
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition);
            line-height: 0;
            box-shadow: var(--shadow-subtle);
            border: 1px solid #e2e8f0;
            background-color: #fafbfc;
        }

        .banner-link:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-card);
            border-color: #cbd5e1;
        }

        .banner-img {
            max-height: 68px;
            width: auto;
            max-width: 96vw;
            object-fit: contain;
            border-radius: var(--radius-md);
            display: block;
        }

        .marquee-bar {
            background-color: #fafbfc;
            border-top: 1px solid #e2e8f0;
            padding: 6px 0;
            font-size: 0.8rem;
            color: #64748b;
            letter-spacing: 0.01em;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #10b981;
            display: inline-block;
            margin-right: 6px;
            vertical-align: middle;
            animation: pulse-dot 2s infinite ease-in-out;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }
    </style>
</head>
<body class="header-body">

    <div class="banner-container">
        <a href="home.html" target="main_content" class="banner-link" 
           title="Klik banner untuk kembali ke Beranda (Home)"
           style="border: 1px solid #e2e8f0;">
            <img src="images/banner.png" alt="Banner Web Portal STT Terpadu Nurul Fikri - Praktikum Pertemuan 4" class="banner-img">
        </a>
    </div>

    <div class="marquee-bar">
        <marquee scrollamount="5" behavior="scroll" direction="left" onmouseover="this.stop();" onmouseout="this.start();">
            <span class="status-dot"></span>
            <span style="color: #0f172a; font-weight: 600;">PORTAL AKADEMIK STT TERPADU NURUL FIKRI</span>
            <span style="color: #cbd5e1; margin: 0 8px;">&bull;</span>
            <span style="color: #475569;">Praktikum Pemrograman Web &bull; <strong>Pertemuan 4</strong>: Styling CSS3 Modern Minimalis</span>
            <span style="color: #cbd5e1; margin: 0 8px;">&bull;</span>
            Mahasiswa: <strong style="color: #0f172a;">Raffi Ramadhan</strong>
            <span style="color: #cbd5e1; margin: 0 6px;">|</span>
            NIM: <strong style="color: #2563eb; font-family: monospace;">0110224204</strong>
            <span style="color: #cbd5e1; margin: 0 6px;">|</span>
            Prodi: <span style="color: #475569;">Teknik Informatika (TI - S1)</span>
        </marquee>
    </div>

</body>
</html>
