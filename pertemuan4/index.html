<!-- STRUKTUR FRAMESET DENGAN PEMBATAS SUBTLE MINIMALIS (#e2e8f0) -->
<frameset rows="125,50,*,48" frameborder="1" border="1" bordercolor="#e2e8f0">

    <!-- FRAME 1: HEADER (BANNER WEB & MARQUEE MINIMALIS) -->
    <frame src="header.html" name="header_frame" scrolling="no" noresize marginwidth="0" marginheight="0">

    <!-- FRAME 2: NAVIGATION MENU BAR (CLEAN MINIMALIST BAR) -->
    <frame src="menu.html" name="menu_frame" scrolling="no" noresize marginwidth="0" marginheight="0">

    <!-- FRAME 3: KONTEN 3 KOLOM DENGAN RUANG LAPANG -->
    <frameset cols="24%,*,24%" frameborder="1" border="1" bordercolor="#e2e8f0">
        <!-- FRAME KIRI: SOSMED TEMAN & TAUTAN KAMPUS -->
        <frame src="left.html" name="left_frame" scrolling="auto" marginwidth="14" marginheight="14">

        <!-- FRAME UTAMA: BERANDA, STUDI, GALERI -->
        <frame src="home.html" name="main_content" scrolling="auto" marginwidth="20" marginheight="20">

        <!-- FRAME KANAN: MATERI FULLSTACK & TOOLS -->
        <frame src="right.html" name="right_frame" scrolling="auto" marginwidth="14" marginheight="14">
    </frameset>

    <!-- FRAME 4: FOOTER (MINIMALIST FOOTER INFO) -->
    <frame src="footer.html" name="footer_frame" scrolling="no" noresize marginwidth="0" marginheight="0">

    <noframes>
        <body>
            <p>Browser Anda tidak mendukung Frameset HTML. Silakan akses halaman utama di <a href="home.html">home.html</a>.</p>
        </body>
    </noframes>
