<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Navigation Menu</title>

    <!-- ====================================================================
         BOBOT 70%: CSS DI SELURUH PAGE LATIHAN (EXTERNAL CSS)
         Menghubungkan stylesheet global style.css
         ==================================================================== -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <!-- ====================================================================
         BOBOT 30%: CSS DI SEBAGIAN LATIHAN (INTERNAL CSS)
         Styling spesifik untuk navigation bar modern minimalis
         ==================================================================== -->
    <style type="text/css">
        body.nav-body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            border-bottom: 1px solid #e2e8f0;
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 16px;
        }

        .nav-item {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 18px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #475569;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-full);
            text-decoration: none !important;
            letter-spacing: -0.01em;
            transition: var(--transition);
        }

        .nav-item:hover {
            color: #0f172a !important;
            background-color: #f1f5f9;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .nav-item:active {
            transform: translateY(0);
        }

        .nav-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body class="nav-body">

    <!-- MENU NAVIGASI DENGAN HYPERLINK INTERNAL KE TARGET MAIN_CONTENT -->
    <div class="nav-container">
        <!-- ITEM 1: HOME -->
        <!-- IMPLEMENTASI BOBOT 30%: Inline CSS custom dot color -->
        <a href="home.html" target="main_content" class="nav-item">
            <span class="nav-indicator" style="background-color: #2563eb;"></span>
            <span>Beranda (Home)</span>
        </a>

        <!-- ITEM 2: STUDY -->
        <a href="study.html" target="main_content" class="nav-item">
            <span class="nav-indicator" style="background-color: #059669;"></span>
            <span>Riwayat Studi</span>
        </a>

        <!-- ITEM 3: GALLERY -->
        <a href="gallery.html" target="main_content" class="nav-item">
            <span class="nav-indicator" style="background-color: #d97706;"></span>
            <span>Galeri Teknologi</span>
        </a>
    </div>

</body>
</html>
